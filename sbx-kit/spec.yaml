schemaVersion: "2"
kind: sandbox
name: omp
displayName: OMP
description: The omp coding agent (oh-my-pi) — runs inside a Docker sbx sandbox.

sandbox:
  image: "omp-sbx:latest"
  entrypoint: [omp-init.sh]

agentInstructions:
  filename: AGENTS.md
  content: |
    ## Sandbox environment

    You are running inside a Docker sbx sandbox (microVM). The workspace is
    mounted at `/home/agent/workspace`. Your agent state (`PI_CODING_AGENT_DIR`
    points at `<workspace>/.omp-agent`) — agent.db, models.yml, sessions,
    memories, managed-skills — lives in the workspace and persists across
    sandbox restarts through that mount. The directory is excluded from git via
    `.git/info/exclude`; leave it alone and never commit or delete it.

    Provider credentials never persist inside the sandbox. `OPENAI_API_KEY`
    (and, if set, `OPENAI_BASE_URL`) is injected at launch from the host —
    nothing to log into or configure. If a model call fails auth, tell the
    user; the key is fixed on the host, not in here.

    GitHub access is proxy-managed: the host-side sbx proxy injects the
    credential into requests to github.com (git push/pull over HTTPS works with
    no credential helper or SSH setup; api.github.com and the githubusercontent
    zone are allowed too). If a git operation to github.com fails with 401, the
    host's github secret is not registered — tell the user. GitHub API work
    goes through MCP servers, not a `gh` CLI.

    `sudo` is passwordless; use it for system package installs.

    The omp `browser` tool (Puppeteer/Chromium) cannot spawn inside this microVM
    (ENOEXEC on the bundled chrome-linux64 binary). For browser automation use the
    installed `agent-browser` CLI instead (`agent-browser open <url>`, then
    `snapshot`, `click @eN`, `screenshot`, etc.). It uses a real Chromium
    installed via Playwright (`AGENT_BROWSER_EXECUTABLE_PATH=/usr/local/bin/chromium`).
    The sbx TLS proxy intercepts HTTPS. The proxy CA is injected into the
    container trust store at runtime by sbx, so `agent-browser` validates
    certificates normally — no cert-error bypass needed. For fetching static web content
    (articles, docs, JSON, PDFs) prefer the `read` tool on a URL — no browser needed.

# ── Network ──────────────────────────────────────────────────────────────────
permissions:
  network:
    allow:
      # GitHub: omp release downloads and self-update, plus git over HTTPS.
      # Credential injection into these domains comes from the built-in
      # `github` service when the host registers a secret for it
      # (sbx secret set github --command 'gh auth token').
      - "github.com:443"
      - "api.github.com:443"
      - "*.githubusercontent.com:443"
      # Package registries (npm, pip)
      - "registry.npmjs.org:443"
      - "pypi.org:443"
      - "files.pythonhosted.org:443"
      # Playwright browser downloads
      - "cdn.playwright.dev:443"
      - "playwright.download.prss.microsoft.com:443"

# ── Environment ──────────────────────────────────────────────────────────────
environment:
  variables:
    # Redirect every agent artifact (agent.db, sessions, memories,
    # managed-skills, models.yml) into the workspace, so state persists on the
    # host through the workspace mount alone — no ~/.omp mount. omp-init.sh
    # creates the directory and git-excludes it. Deliberately not ".omp": the
    # harness reads a .omp directory in the workdir as project config.
    PI_CODING_AGENT_DIR: "/home/agent/workspace/.omp-agent"
    # .omp resolves to ~/.omp inside the sandbox; omp-init.sh keeps that path
    # free of a real config dir, so the harness's own onboarding is used.
    PI_CONFIG_DIR: ".omp"
    HOME: "/home/agent"
    AGENT_BROWSER_EXECUTABLE_PATH: "/usr/local/bin/chromium"
    # Keep validation on: sbx puts its proxy CA in the OS trust store.
    AGENT_BROWSER_IGNORE_HTTPS_ERRORS: "false"

setup:
  startup:
    - command:
        - "bash"
        - "-c"
        - |
          # Trust WORKSPACE_DIR for the host mount path. Scanning `mount`
          # instead would also match /etc/hosts, another virtiofs mount.
          WS_HOST="${WORKSPACE_DIR:-}"
          if [ -d "$WS_HOST" ] && [ "$WS_HOST" != "/home/agent/workspace" ]; then
            rm -rf /home/agent/workspace
            ln -sfn "$WS_HOST" /home/agent/workspace
          else
            echo "omp-sbx: workspace mount unavailable: ${WS_HOST:-unset}" >&2
            exit 1
          fi
      user: "1000"
      description: Symlink the workspace mount
