schemaVersion: "2"
kind: sandbox
name: omp
displayName: OMP
description: The omp coding agent (oh-my-pi) — runs inside a Docker sbx sandbox.

sandbox:
  image: "omp-sbx:latest"
  entrypoint: [omp-init.sh]

agentInstructions:
  filename: AGENTS.md
  content: |
    ## Sandbox environment

    You are running inside a Docker sbx sandbox (microVM). The workspace is
    mounted at `/home/agent/workspace`. Your agent state (`PI_CODING_AGENT_DIR`
    points at `<workspace>/.omp-agent`) — agent.db, models.yml, sessions,
    memories, managed-skills — lives in the workspace and persists across
    sandbox restarts through that mount. The directory is excluded from git via
    `.git/info/exclude`; leave it alone and never commit or delete it.

    Provider credentials never persist inside the sandbox. `OPENAI_API_KEY`
    (and, if set, `OPENAI_BASE_URL`) is injected at launch from the host —
    nothing to log into or configure. If a model call fails auth, tell the
    user; the key is fixed on the host, not in here.

    GitHub authentication is forwarded from the host: `gh` CLI commands work
    directly, and `git push` over HTTPS uses the gh credential helper (no
    separate token or SSH setup needed). If `gh auth status` fails, the host's
    `~/.config/gh` is not mounted — recreate the sandbox with `omp-sbx --new`.

    `sudo` is passwordless; use it for system package installs.

    Amazon Bedrock models are available only when the project `.env` sets
    `OMP_SBX_AWS_PROFILE`. Credentials resolve through `credential_process`, so
    the AWS CLI renews the short-lived access token on its own. Renewal stops
    working once the SSO client registration lapses, which takes weeks. If an AWS
    call reports an expired or missing token, run
    `aws sso login --no-browser --use-device-code --profile "$OMP_SBX_AWS_PROFILE"`
    and give the printed URL and code to the user to open - no browser runs inside
    this sandbox, so never try to open it here. Keep `--use-device-code`: without
    it the CLI prints a URL that redirects to a port inside this sandbox, which
    the user's browser cannot reach.

    The omp `browser` tool (Puppeteer/Chromium) cannot spawn inside this microVM
    (ENOEXEC on the bundled chrome-linux64 binary). For browser automation use the
    installed `agent-browser` CLI instead (`agent-browser open <url>`, then
    `snapshot`, `click @eN`, `screenshot`, etc.). It uses a real Chromium
    installed via Playwright (`AGENT_BROWSER_EXECUTABLE_PATH=/usr/local/bin/chromium`).
    The sbx TLS proxy intercepts HTTPS. The proxy CA is injected into the
    container trust store at runtime by sbx, so `agent-browser` validates
    certificates normally — no cert-error bypass needed. For fetching static web content
    (articles, docs, JSON, PDFs) prefer the `read` tool on a URL — no browser needed.

# ── Network ──────────────────────────────────────────────────────────────────
permissions:
  network:
    allow:
      # Model providers - add the ones you use
      - "api.anthropic.com:443"
      - "api.openai.com:443"
      - "openrouter.ai:443"
      - "*.openrouter.ai:443"
      - "opencode.ai:443"
      - "*.opencode.ai:443"
      # Amazon Bedrock, us-east-1. Add the hosts for another region to use it.
      - "bedrock-runtime.us-east-1.amazonaws.com:443"
      - "bedrock.us-east-1.amazonaws.com:443"
      # AWS SSO: oidc serves the device-code login, portal.sso hands out role
      # credentials, sts answers get-caller-identity.
      - "oidc.us-east-1.amazonaws.com:443"
      - "portal.sso.us-east-1.amazonaws.com:443"
      - "sts.us-east-1.amazonaws.com:443"
      # omp release downloads and self-update
      - "github.com:443"
      - "*.githubusercontent.com:443"
      - "raw.githubusercontent.com:443"
      # Package registries (npm, pip, cargo)
      - "registry.npmjs.org:443"
      - "pypi.org:443"
      - "files.pythonhosted.org:443"
      # Local model servers on the host
      - "host.docker.internal:*"
      # Docs and context providers
      - "*.context7.com:443"
      - "code.visualstudio.com:443"
      - "*.cloudflare.com:443"
      # Playwright browser downloads
      - "cdn.playwright.dev:443"
      - "playwright.download.prss.microsoft.com:443"

# ── Environment ──────────────────────────────────────────────────────────────
environment:
  variables:
    # Redirect every agent artifact (agent.db, sessions, memories,
    # managed-skills, models.yml) into the workspace, so state persists on the
    # host through the workspace mount alone — no ~/.omp mount. omp-init.sh
    # creates the directory and git-excludes it. Deliberately not ".omp": the
    # harness reads a .omp directory in the workdir as project config.
    PI_CODING_AGENT_DIR: "/home/agent/workspace/.omp-agent"
    # .omp resolves to ~/.omp, the symlink to the host config mount.
    PI_CONFIG_DIR: ".omp"
    HOME: "/home/agent"
    GH_CONFIG_DIR: "/home/agent/.config/gh"
    AGENT_BROWSER_EXECUTABLE_PATH: "/usr/local/bin/chromium"
    # Keep validation on: sbx puts its proxy CA in the OS trust store.
    AGENT_BROWSER_IGNORE_HTTPS_ERRORS: "false"
    # botocore ships its own CA bundle and ignores the OS trust store, so every
    # AWS call fails against the sbx TLS proxy until it is pointed back at it.
    AWS_CA_BUNDLE: "/etc/ssl/certs/ca-certificates.crt"

setup:
  startup:
    - command:
        - "bash"
        - "-c"
        - |
          # ~/.config/gh is symlinked here rather than in omp-init.sh - this
          # hook runs before omp, and the entrypoint only handles what omp
          # reads at load time.
          GH_HOST=$(mount | grep 'type virtiofs' | grep '/.config/gh ' | sed 's/.* on //; s/ type.*//' | head -1)
          if [ -n "$GH_HOST" ] && [ "$GH_HOST" != "$HOME/.config/gh" ]; then
            mkdir -p "$HOME/.config"
            rm -rf "$HOME/.config/gh"
            ln -sfn "$GH_HOST" "$HOME/.config/gh"
          fi
          # Point git at gh's credential helper, so `git push` over HTTPS uses
          # the mounted session. hosts.yml is the only check possible here:
          # `gh auth status` needs github.com, which may not be reachable yet.
          if [ -f "$HOME/.config/gh/hosts.yml" ]; then
            gh auth setup-git 2>/dev/null || true
          fi
          # Trust WORKSPACE_DIR for the host mount path. Scanning `mount`
          # instead would also match /etc/hosts, another virtiofs mount.
          WS_HOST="${WORKSPACE_DIR:-}"
          if [ -d "$WS_HOST" ] && [ "$WS_HOST" != "/home/agent/workspace" ]; then
            rm -rf /home/agent/workspace
            ln -sfn "$WS_HOST" /home/agent/workspace
          else
            echo "omp-sbx: workspace mount unavailable: ${WS_HOST:-unset}" >&2
            exit 1
          fi
      user: "1000"
      description: Symlink the gh mount and wire the credential helper
