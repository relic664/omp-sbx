schemaVersion: "1"
# omp-sbxenv fills these in at launch: one file serves every project
# directory, so nothing here is hardcoded.
name: ${OMP_SBXENV_NAME}
agent: omp
kits:
  - ${OMP_SBXENV_KIT_DIR}
workspace: ${OMP_SBXENV_WORKSPACE}
# No ~/.omp in additionalWorkspaces: agent state (agent.db, sessions,
# memories, managed-skills) lives in the workspace itself, via the kit's
# PI_CODING_AGENT_DIR. Bedrock opt-in projects run omp-sbx instead - a static
# env file cannot conditionally mount ~/.omp.
sandboxOptions:
  template: omp-sbx:latest
